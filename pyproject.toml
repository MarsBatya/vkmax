[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vkmax"
version = "1.0.2"
description = "Python client for MAX messenger"
readme = "README.md"
authors = [{name = "nsdkinx", email = "nsdkinx@ya.ru" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["vk", "vkapi", "max-messenger", "vkmax", "oneme"]
dependencies = [
    "aiohttp",
    "websockets",
    # No stable adaptix 3.x release exists; pinned to the beta the packet retort is tested against.
    "adaptix==3.0.0b11",
    "lz4",
    "msgpack",
    "python-socks",
    "typing-extensions; python_version < '3.11'",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "requests",
    "mypy",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.package-data]
vkmax = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::ResourceWarning"]

[tool.mypy]
python_version = "3.10"
files = ["vkmax"]

[[tool.mypy.overrides]]
module = ["lz4.*", "msgpack.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "vkmax.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "S311", "E501"]

[project.urls]
Homepage = "https://github.com/nsdkinx/vkmax"
News = "https://t.me/max_messenger_python"
